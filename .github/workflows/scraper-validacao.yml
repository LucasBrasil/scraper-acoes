name: Scraper Validação

on:
  workflow_dispatch:

jobs:
  scraper-validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install --upgrade requests gspread google-auth-oauthlib
      - run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; find . -type f -name "*.pyc" -delete 2>/dev/null; echo "✓ Cache limpo"
      - run: grep -c "f\"{round.*%\"" scraper_validation.py && echo "❌ ERRO: Arquivo antigo com %" || echo "✓ OK: Arquivo correto (sem %)"
      - run: python -u scraper_validation.py
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
