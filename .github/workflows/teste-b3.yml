    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests gspread google-auth-oauthlib beautifulsoup4
      - run: |
          python - <<'PY'
          from scraper import buscar_eventos_b3
          for t in ['WEGE3', 'ITUB3', 'MGLU3', 'BBAS3']:
              print(t, buscar_eventos_b3(t))
          PY
